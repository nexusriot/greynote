<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- No remote content is ever loaded: everything comes from the bundle, and
         all network traffic happens in the main process. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" />
    <title>GreyNote</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="root"></div>
    <script src="bundle.js"></script>
</body>
</html>
